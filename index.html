</style><header><div class="brand">指间灵感 <small>NAIL MUSE</small></div><div>美甲风格探索室 ✧</div></header><main id="app"></main><footer>每一种手型，都有属于自己的美。 · NAIL MUSE</footer><script>const QUESTIONS = [
[1,'手自然放松时，整体轮廓更接近哪一种？','',['手背和指腹比较饱满，轮廓圆润','手背和手指比较纤细，骨骼线条清楚','饱满程度适中，骨骼线条不明显','手背与手指表现不同，不容易归类']],
[2,'中指长度与手掌长度相比，更接近哪一种？','中指长度从指根量到指尖；手掌长度从手腕横纹量到中指根部。可目测，也可用尺子辅助。',['中指明显比手掌短','中指比手掌短一些','中指与手掌接近等长，或更长','无法判断']],
[3,'单独看手指，粗细更接近哪一种？','',['横向比较饱满、偏宽','粗细适中','比较纤细、偏窄','各手指差异较大／无法判断']],
[4,'手指自然伸直时，关节有多明显？','',['关节明显鼓出，比前后两段更宽','关节轻度可见，过渡比较柔和','轮廓比较平滑，关节不明显','无法判断']],
[5,'从指根到指尖，手指整体怎样变化？','观察整体走势，暂时忽略关节局部的鼓出。',['指根较宽，越靠近指尖越细','前后粗细变化不大','指尖比较饱满，收细不明显','各手指差异较大／无法判断']],
[6,'指甲与手指正面相比，横向宽度如何？','',['甲面较宽，几乎占满手指正面','宽度适中，两侧有少量皮肤露出','甲面较窄，两侧皮肤露出比较明显','被美甲遮挡／无法判断']],
[7,'你的甲床看起来偏短、偏方，还是偏长？','甲床就是指甲下面与皮肤相连、通常呈粉色或肤色的区域。只看这块区域：从甲根到粉色区域结束处是长度，左右最宽处是宽度；不算前端能剪掉的白边。',['长度明显小于宽度，整体偏扁','长度与宽度接近，整体偏方','长度大于宽度，整体偏长','各手指差异较大／无法判断']],
[8,'你的中指甲床实际有多长、多宽？','用毫米尺沿表面轻放测量，不要将尺子伸入指甲下方。',[],true],
[9,'比较指甲根部与前端的宽度，更接近哪一种？','这里比较的是甲面轮廓，不是已经修剪出的尖端形状。',['前端明显更宽，像扇子展开','两侧大致平行，前后宽度接近','前端比根部窄，向前逐渐收拢','原生形状被修剪或美甲改变／无法判断']],
[10,'从指尖正前方看，甲面的横向弧度如何？','',['比较平，弯曲不明显','呈自然拱形，两侧柔和向下','弧度较高，两侧明显向内卷','太短、被遮挡或无法判断']],
[11,'从侧面看，原生指甲向哪个方向延伸？','',['基本平顺地向前延伸','前端逐渐向下弯','前端逐渐向上翘','太短、被遮挡或无法判断']],
[12,'正面看，指甲中线与手指方向一致吗？','',['基本一致','少数指甲明显向左或向右偏','多枚指甲的方向都不太一致','无法判断']],
[13,'目前原生指甲的前端，伸出指尖多少？','这是观察现状，不是询问你想留多长。',['还没有到指尖','基本与指尖齐平','超出约 1—2 mm','超出约 3 mm 或更多','做了延长或穿戴甲，无法观察原生长度']],
[14,'食指、中指和无名指的甲床条件一致吗？','',['宽度、长短和弧度大体一致','有一枚明显更短或更宽','多枚指甲差异明显','无法判断']],
[15,'不做美甲时，原生指甲的状态通常如何？','不要为了测试用力按压或弯折指甲。',['比较稳定，留出一点长度也不容易弯折','偏软，稍留长就容易弯','容易分层、崩边或断裂','偏软，同时也容易分层或断裂','很少留长／不清楚']],
[16,'最近一次卸甲后，指甲是否出现明显变化？','',['没有明显变化，状态与以前接近','比以前更薄、更软或更容易断','出现刺痛、触痛或明显不适','最近没有做过美甲／不清楚']],
[17,'目前有没有需要先处理的指甲或周围皮肤情况？','若多项符合，优先选 A，其次选 B。',['红肿、疼痛、破损、出血或渗液','指甲与下方组织出现新发生的分离，或出现不明原因的明显变色、增厚','没有上述情况','看不清楚或无法判断']],
[18,'使用甲油胶、延长产品或甲片胶后，是否曾出现异常反应？','',['没有出现过明显反应','曾出现瘙痒、红疹、水疱，或接触处反复不适','已经由医生确认对某种美甲产品成分过敏','没有使用经历／不确定']],
[19,'自然光下，你的手部肤色深浅更接近哪一种？','',['偏浅','中等','偏深','不确定']],
[20,'避开手掌和关节局部泛红的位置，手背整体底色更接近哪一种？','',['偏米黄、金黄或暖桃色','偏粉、冷玫瑰色','带一点灰绿或橄榄感','冷暖都不明显','无法判断']],
[21,'将金色和银色首饰分别靠近手背，哪一种更协调？','尽量比较大小、光泽相近的饰品，观察皮肤是否更均匀、自然，而不是选择更喜欢的首饰。',['金色更协调','银色更协调','两者都协调','两者效果都一般／看不出差别','没有对比条件，跳过'],true],

[24,'对比浅色、中等深度和深色，哪一组最衬你的手？','尽量使用同一色相的实物色卡，如浅豆沙、中豆沙、深豆沙。观察肤色与颜色的关系，而不是选择自己喜欢的深浅。',['浅色更自然，整体连贯','中等深度更协调','深色对比更清晰，更能衬托肤色','都可以，各有不同效果','没有对比条件／看不出来'],true]

 if(r.hand.primary.name==='扁平手')r.caution.push('大面积厚重浮雕或平淡无层次的灰哑光：若希望增加立体感，先试细腻亮面、薄透叠色或小范围猫眼。');
 if(!r.caution.length)r.caution.push('过度收窄侧边与厚重堆胶：会改变自然比例。保留侧边支撑，先试简洁轮廓。');
 r.caution.push(r.palette.avoid);r.overlays.forEach(o=>r.caution.push(o.tip));
 return enrichRecommendations(r,a);
}
const mmText=mm=>mm[0]+'–'+mm[1]+' mm';
function actualEvidence(a,ids){return ids.map(id=>choice(a,id)).filter(Boolean).map(s=>'“'+s+'”').join('、')}
function planCard(p,r,long){const s=NAIL_SHAPES[p.name];const restricted=r.stop||r.weak||(long&&(r.uncertain||r.custom));return `<article class="plan-card">${nailIcon(s[0])}<small>${p.conditional?'有条件可选':p.first?'首选方案':'另一种效果'}</small><h3>${p.name}</h3><strong>${restricted?'状态确认后再定长度':'样片试比：超出指尖 '+mmText(p.mm)}</strong><p>${s[1]}</p><p><b>为你推荐的理由：</b>${p.reason||r.lengthWhy}</p><p class="fine">款式搭配：${s[2]}。</p>${long&&p.name==='轻杏仁甲'?'<p class="fine">需有足够侧边长度才能收出圆润尖端；短甲床不强行修成杏仁。</p>':''}</article>`}
function lengthRoutes(r,a){
 const compact=a[7]===0||a[26]===0, joint=a[4]===0||a[28]===3;
 const short={title:'短款首选',length:'超出指尖 '+mmText(r.shortMM)+'，作为这次手型的优先试比长度。'+(compact?'你的甲床偏短或手整体偏小，先从自然短款开始；想加长可比较 2–3 mm 的圆弧样片。':'常见短款可在 1–3 mm 内试比；想多一点纵向感，可再比较 3–5 mm 中短样片。'),shape:r.shapeShort.join(' / ')+'。'+(a[7]===0?'甲床短宽时以轻椭圆或圆角为主，不强行收出尖端。':'保留圆润边缘，不为修尖而过度收窄侧边。'),fit:'结合你“'+r.body+'、'+r.bed+'”的特征，适合想保留轻巧、自然轮廓的路线。也可供第一次做美甲，或经常打字、带娃、做家务、希望减少碍事感的人参考；这些使用场景未在测试中评估。',effect:'干净、'+(a[1]===0||a[26]===0?'圆润可爱':'简洁利落')+'，靠圆弧和轻微纵向感整理指尖轮廓，不靠很长的前端拉长手指。',note:'甲床偏短时控制前端量感；避免甲面太宽、太厚，边缘保持圆润。短款也需按各指甲的真实状态调整。'};
 const long={title:'延长／甲片首选',length:'日常延长先试超出指尖 '+mmText(r.longMM)+'。若想要明显长款，可把超出指尖约 10 mm（1 cm）的样片靠近手指比较整体比例。'+(compact||joint?'你的'+(compact?'短甲床／小手比例':'明显骨节／宽指尖特征')+'更适合优先控制前端量感，不把 10–15 mm 作为本次首选。':'确认比例、甲床支撑及使用适应性后，才考虑 10–15 mm（1–1.5 cm）。')+'第一次不建议直接选择超过 15 mm 的超长款。',shape:r.shapeLong.join(' / ')+'。'+(joint?'保留适度甲尖宽度，避免极细长尖甲。':a[7]===0?'短甲床优先椭圆或方圆，不为做杏仁而强行削窄侧边。':'想增加纵向感可试轻杏仁或椭圆，想更利落可试方圆延长。'),fit:'适合希望增加纵向感、想要更明显美甲存在感，并计划做甲片或延长的人；前提是甲床条件允许，并能适应相应长度。你的手型依据是“'+r.body+'”，实际支撑与用手需求需另行确认。',effect:'用适度延长和柔和收边增加纵向感，让指尖线条更修长。'+(joint?'你的轮廓更适合用柔和方圆平衡，避免过度收尖。':''),note:'不是越长越显手长。前端太长、太尖、太窄可能显笨重或不自然；甲床偏短控制前端量感，骨节明显避免过窄长尖甲。样片试比只判断外观，不代表能够承受该长度。'};
 return {short,long};
}
function routeSection(r,a){const routes=lengthRoutes(r,a);return `<section class="panel route-panel"><small>FIND YOUR LENGTH</small><h2>长度怎样和你的手配合？</h2><p>两条路线，把长度、甲型和上手效果一起看。以下均指超出指尖皮肤的长度。</p>${r.stop||r.weak?'<div class="status attention"><b>以下为状态恢复后的选款参考</b><p>你报告了不适、异常反应或甲面受损，当前不建议直接做延长或试用胶类产品。先确认原因与恢复状态，再按下方路线选款。</p></div>':r.custom||r.uncertain?'<p class="fine">你的结构或甲质信息需要现场确认；以下长度用于样片外观比较，不作为已确认的施工长度。</p>':''}<div class="route-grid">${Object.values(routes).map((v,i)=>`<article class="route-card"><small>路线 ${i+1}</small><h3>${v.title}</h3><dl>${[['推荐长度',v.length],['推荐甲型',v.shape],['适合',v.fit],['效果',v.effect],['注意',v.note]].map(([k,t])=>'<div><dt>'+k+'</dt><dd>'+esc(t)+'</dd></div>').join('')}</dl></article>`).join('')}</div><p class="fine">${r.lengthNote} 未测量整根手指长度，因此不输出精确的“指长百分比”。</p></section>`}
function result(){const r=analyse(answers),blocked=r.stop||r.weak;app.innerHTML=`
 <div class="result-heading"><small>YOUR PERSONAL NAIL EDIT</small><h1 tabindex="-1">你的专属美甲方案</h1><p>先看手型，再选短款或延长款，最后确定配色。</p></div>
 <section class="profile"><div><small>手型分析 · 你的手部画像</small><h2>${r.body}</h2><p>${r.finger}；${r.width}，${r.bed}。</p><div class="tags">${r.hand.secondary.map(h=>'<span class="tag">同时带有：'+h.name+'特征</span>').join('')}</div><p><b>美甲沟通关键词</b><br>${r.hand.primary.keywords}</p></div><div class="profile-art">${nailIcon('oval')}${nailIcon('almond')}${nailIcon('squoval')}<span>Made for your hands.</span></div></section>
 <section class="panel"><h2>为什么更接近这种手型？</h2><p>你选择了${esc(actualEvidence(answers,r.hand.primary.ids))||'无法明确判断的选项'}，因此${r.body.startsWith('混合')?'暂时保留混合轮廓，不强行归类':'更接近'+r.body+'的外观特征'}。</p>${r.hand.secondary.map(h=>'<p>补充特征：'+h.name+'，依据是'+esc(actualEvidence(answers,h.ids))+'。</p>').join('')}<p class="fine">手型可能重叠。这是用于选款沟通的外观分类，不是医学诊断；甲床条件会进一步调整甲型方案。</p></section>
 ${blocked||r.uncertain||r.custom?`<div class="status attention"><b>${r.stop?'先处理不适，再安排美甲':r.weak?'先恢复原生甲状态':'延长方案需现场确认'}</b><p>${r.stop?'你选择了疼痛、异常变化或产品反应相关选项。本次提供选款灵感，暂不指定施工长度；先确认原因，有过敏经历不要自行换胶试用。':r.weak?'你提到偏软、分层或卸甲后变薄。当前先保持自然短甲，以下款式可作恢复后的参考。':'你有结构差异或关键条件尚不明确；长款先比较轮廓，长度由美甲师逐指确认。'}</p></div>`:''}
 <section class="panel"><small>THE SHORT EDIT</small><h2>如果做短款，这三种更值得试</h2><p>${r.lengthWhy}</p><div class="plan-grid">${r.shortPlans.map(p=>planCard(p,r,false)).join('')}</div></section>
 <section class="panel"><small>THE LONG EDIT</small><h2>如果做长款／延长，推荐这三种</h2><p>${r.longMM[1]<=3?'你的条件更适合小幅延长，长款方案也先从中短视觉试起，不为了“长”而强行加长。':'先试比适度延长，再看整只手的比例；各手指不必留得一样长。'}</p><p>${r.shapeReason}</p><div class="plan-grid">${r.longPlans.map(p=>planCard(p,r,true)).join('')}</div>${shapeGuide()}</section>
 ${routeSection(r,answers)}
 <section class="panel colors"><small>YOUR COLOR STORY</small><h2>${r.skinName}</h2><p>${r.skinDetail}。${r.overlays.length?'同时观察到：'+r.overlays.map(o=>o.name).join('、')+'。':''}</p><details><summary>肤色判断依据</summary><p>你选择了${esc(actualEvidence(answers,[19,20,21,22,29]))}。首饰与色卡只提供试色线索，屏幕和环境光会影响判断；不通过单一血管颜色定冷暖。</p></details><p>${r.shadeHint.replace('左侧浅色方向','浅色方向').replace('右侧深色方向','深色方向').replace('中间色','中等深度颜色')} ${r.chroma}</p>${expandedColors(r,answers)}<p>${r.colorExtra}</p>${r.overlays.map(o=>'<div class="skin-overlay"><b>'+o.name+'的配色调整</b><p>'+o.tip+'</p></div>').join('')}<p class="fine">色卡是色系示意，不对应品牌色号。推荐是试色起点；喜欢强反差效果时，也可以尝试慎选色。</p></section>
 <section class="panel"><small>STYLES TO AVOID</small><h2>你的美甲避雷清单</h2><p>以线条协调、不过分突出横向感或局部色差为目标：</p><ul class="avoid-list">${r.caution.map(s=>'<li>'+s+'</li>').join('')}</ul>${r.notes.length?'<details open><summary>给美甲师的结构提示</summary>'+r.notes.map(s=>'<p>'+s+'</p>').join('')+'</details>':''}</section>
 <section class="closing"><div><button class="primary" onclick="copyResult()">复制我的建议</button><button class="back" onclick="step=0;quiz();focusPage()">修改答案</button><button class="back" onclick="window.print()">保存为 PDF</button><button class="back" onclick="answers={};step=0;home();focusPage()">重新测试</button></div><p id="copyStatus" role="status"></p></section>
 <details class="sources"><summary>推荐依据与适用范围</summary><p>手型名称参考本测试的外观分类，毫米区间是本测试的造型试比规则，不是临床标准或统一最佳比例。未评估职业、用手强度和真实建构，不能保证耐用性。甲型通用原则参考 <a href="https://www.opi.com/blog/nail-care/how-to-find-the-best-nail-shape-for-your-hands" target="_blank" rel="noopener">OPI 甲型指南</a>，配色思路参考 <a href="https://www.opi.com/blog/nail-trends/color-theory-for-your-nails" target="_blank" rel="noopener">OPI 色彩指南</a>；具体规则结合你的回答与本测试的审美建议。</p></details>`;
}
function reportText(r){const lengths=(plans,long)=>plans.map(p=>p.name+'（'+(r.stop||r.weak||(long&&(r.custom||r.uncertain))?'状态确认后再定长度':'超出指尖 '+mmText(p.mm))+'）').join('；');return `我的手型：${r.body}${r.hand.secondary.length?'；兼有'+r.hand.secondary.map(h=>h.name).join('、'):''}。\n${r.finger}；${r.width}；${r.bed}。\n沟通关键词：${r.hand.primary.keywords}\n短款：${lengths(r.shortPlans,false)}\n长款／延长：${lengths(r.longPlans,true)}\n${r.lengthWhy}\n${r.lengthNote}\n肤色：${r.skinName}，${r.skinDetail}\n低饱和：${r.palette.soft.map(c=>c[0]).join('、')}\n高饱和：${r.palette.bright.map(c=>c[0]).join('、')}\n深色：${r.palette.deep.map(c=>c[0]).join('、')}\n${r.overlays.map(o=>o.name+'：'+o.tip).join('\n')}\n避雷：${r.caution.join('\n')}\n${r.notes.join('\n')}`}
async function copyResult(){const r=analyse(answers);const text=reportText(r)+"\n优先试色："+r.topColors.map(c=>c[0]).join("、")+"\n完整色单："+["daily","soft","bright","deep","extra","finish"].map(k=>r.palette[k].map(c=>c[0]).join("、")).join("；")+"\n颜色替代："+r.colorAlternatives+"\n甲型理由："+r.shapeReason+"\n\n长度路线（"+(r.stop||r.weak?"状态恢复后参考":"样片试比参考")+"）：\n"+Object.values(lengthRoutes(r,answers)).map(v=>v.title+"\n推荐长度："+v.length+"\n推荐甲型："+v.shape+"\n适合："+v.fit+"\n效果："+v.effect+"\n注意："+v.note).join("\n\n");try{await navigator.clipboard.writeText(text);document.getElementById('copyStatus').textContent='已复制，可以发给美甲师。'}catch{document.getElementById('copyStatus').innerHTML='<label>可选中并复制下面的文字：<textarea class="copy-fallback" readonly>'+esc(text)+'</textarea></label>';document.querySelector('.copy-fallback').select()}}
</script></html>
